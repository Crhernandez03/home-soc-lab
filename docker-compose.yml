# Sanitized example of the Wazuh stack used on the defender VM.
# Replace all placeholders (ALL_CAPS values) before use.
# Do NOT commit real passwords, certs, or internal IP addresses.
#
# Based on the official Wazuh Docker single-node deployment:
# https://github.com/wazuh/wazuh-docker

version: "3.8"

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.7.3
    hostname: wazuh.manager
    restart: always
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=CHANGE_ME
      - FILEBEAT_SSL_VERIFICATION_MODE=full
    volumes:
      - wazuh_manager_data:/var/ossec/data
      - wazuh_manager_etc:/var/ossec/etc
      - wazuh_manager_logs:/var/ossec/logs
    networks:
      - wazuh-net

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.7.3
    hostname: wazuh.indexer
    restart: always
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
    networks:
      - wazuh-net

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.7.3
    hostname: wazuh.dashboard
    restart: always
    ports:
      - "443:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=CHANGE_ME
      - WAZUH_API_URL=https://wazuh.manager
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=CHANGE_ME
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    networks:
      - wazuh-net

networks:
  wazuh-net:
    driver: bridge

volumes:
  wazuh_manager_data:
  wazuh_manager_etc:
  wazuh_manager_logs:
  wazuh_indexer_data:
